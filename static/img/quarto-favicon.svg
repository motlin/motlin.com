<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<!-- The table: felt inside the walnut rail, the same greens and browns as tokens.css. -->
	<rect width="32" height="32" rx="7" fill="#4E341C"/>
	<rect x="1" y="1" width="30" height="30" rx="6.5" fill="#7A5533"/>
	<rect x="3" y="3" width="26" height="26" rx="5" fill="#2E4A3D"/>
	<!-- One tall round hollow maple piece, drawn in PieceGlyph's 40x60 space and scaled to fit. -->
	<g transform="translate(6.4 0) scale(0.48)">
		<rect x="5" y="14.5" width="30" height="34" fill="#B8925A"/>
		<ellipse cx="20" cy="48" rx="15" ry="4.5" fill="#B8925A"/>
		<rect x="5" y="14.5" width="30" height="32" fill="#E3C48F"/>
		<ellipse cx="20" cy="14.5" rx="15" ry="4.5" fill="#E3C48F" stroke="#B8925A" stroke-width="1"/>
		<path d="M 5 34 A 15 4.5 0 0 0 35 34" fill="none" stroke="#B8925A" stroke-width="1.8"/>
		<path d="M 5 35.6 A 15 4.5 0 0 0 35 35.6" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="0.8"/>
		<ellipse cx="20" cy="14.5" rx="7" ry="2.2" fill="#B8925A"/>
	</g>
</svg>
